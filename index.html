
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CottonCare AI</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f1f8f2;color:#173d2a}
header{background:#176b43;color:white;padding:22px;text-align:center}
main{max-width:750px;margin:35px auto;padding:20px}
.card{background:white;padding:28px;border-radius:18px;box-shadow:0 4px 18px #0001}
h1{margin:0;font-size:30px}
h2{color:#176b43}
p{line-height:1.6}
input,button{margin-top:15px}
input{display:block;max-width:100%}
button{background:#176b43;color:white;border:0;padding:12px 20px;border-radius:8px;cursor:pointer}
#preview{display:none;max-width:100%;max-height:350px;margin-top:20px;border-radius:12px}
#message{background:#fff4d6;padding:12px;border-radius:8px;display:none}
footer{text-align:center;color:#58715f;padding:25px}
</style>
</head>
<body>
<header>
<h1>🌱 CottonCare AI</h1>
<p>Smart Cotton Crop Health Portal</p>
</header>
<main>
<div class="card">
<h2>Check Your Cotton Crop</h2>
<p>Apne kapas ke bimaar patte ki photo upload karein.</p>
<input type="file" id="photo" accept="image/*">
<img id="preview" alt="Uploaded cotton leaf">
<p id="message"></p>
<button id="check" style="display:none">Check Photo</button>
<p>AI disease detection model agle stage mein connect kiya jayega.</p>
</div>
</main>
<footer>Helping farmers grow healthier cotton 🌿</footer>
<script>
const photo=document.getElementById('photo');
const preview=document.getElementById('preview');
const message=document.getElementById('message');
const check=document.getElementById('check');
photo.addEventListener('change',function(){
if(!this.files.length)return;
preview.src=URL.createObjectURL(this.files[0]);
preview.style.display='block';
message.style.display='block';
message.textContent='Photo upload ho gayi hai. Abhi AI model connect nahi hai, isliye bimari ka result nahi diya ja sakta.';
check.style.display='inline-block';
});
check.addEventListener('click',function(){
message.textContent='Photo ready hai. Asli disease detection ke liye trained AI model connect karna baaki hai.';
});
</script>
</body>
</html>
